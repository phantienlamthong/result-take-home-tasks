name: CI for this homework of Max

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        working-directory: app
        run: dotnet restore

      - name: Build
        working-directory: app
        run: dotnet build --no-restore --configuration Release

      - name: Test
        working-directory: app
        run: dotnet test --no-build --configuration Release


  container:
    name: Build and Verify Linux Container
    runs-on: ubuntu-latest
    needs: build-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        working-directory: app
        run: |
          docker build \
            --tag jtl-demo:${{ github.sha }} \
            .

      - name: Run container
        run: |
          docker run -d \
            --name jtl-demo \
            -p 5000:8080 \
            -e ConnectionString="Server=localhost;Database=JtlDemo" \
            jtl-demo:${{ github.sha }}

      - name: Wait for container health
        run: |
          for i in {1..30}; do
            STATUS=$(docker inspect \
              --format='{{.State.Health.Status}}' \
              jtl-demo 2>/dev/null || true)

            echo "Container health: $STATUS"

            if [ "$STATUS" = "healthy" ]; then
              exit 0
            fi

            if [ "$STATUS" = "unhealthy" ]; then
              docker logs jtl-demo
              exit 1
            fi

            sleep 2
          done

          echo "Container did not become healthy"
          docker logs jtl-demo
          exit 1

      - name: Verify health endpoint
        run: |
          curl --fail http://localhost:5000/healthz

      - name: Verify Linux endpoints
        run: |
          curl --fail http://localhost:5000/api/items
          curl --fail http://localhost:5000/api/customers
          curl --fail http://localhost:5000/api/stats

      - name: Verify Windows-only endpoints are excluded
        run: |
          test "$(curl -s -o /dev/null -w '%{http_code}' \
            http://localhost:5000/api/printers)" = "404"

          test "$(curl -s -o /dev/null -w '%{http_code}' \
            http://localhost:5000/api/documents/1/preview)" = "404"

      - name: Verify container runs as non-root
        run: |
          USER_ID=$(docker exec jtl-demo id -u)
          test "$USER_ID" != "0"

      - name: Show container information
        if: always()
        run: |
          docker ps -a
          docker logs jtl-demo

      - name: Cleanup
        if: always()
        run: |
          docker rm -f jtl-demo || true
